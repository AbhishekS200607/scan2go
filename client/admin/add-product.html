<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product — Scan2Go Admin</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/dashboard.html" class="nav-brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary-500);"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
        Admin<span>Portal</span>
      </a>
      <ul class="sidebar-menu">
        <li>
          <a href="/admin/dashboard.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Overview Dashboard
          </a>
        </li>
        <li>
          <a href="/admin/products.html" class="sidebar-link active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            Product Management
          </a>
        </li>
        <li>
          <a href="/admin/inventory.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Stock & Inventory
          </a>
        </li>
        <li>
          <button onclick="auth.logout()" class="sidebar-link" style="background:none;border:none;width:100%;cursor:pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
          </button>
        </li>
      </ul>
    </aside>

    <main class="admin-content" style="max-width:800px;">
      <h2 style="margin-bottom:1.5rem;">Add New Supermarket Product</h2>

      <div class="card">
        <form id="add-product-form" onsubmit="adminUI.handleAddProductForm(event)">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="name">Product Name *</label>
              <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Organic Almond Milk 1L" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="barcode">Barcode (EAN-13 / UPC) *</label>
              <input type="text" id="barcode" name="barcode" class="form-control" placeholder="e.g. 8901234567999" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="sku">SKU Code</label>
              <input type="text" id="sku" name="sku" class="form-control" placeholder="e.g. DAIRY-999">
            </div>

            <div class="form-group">
              <label class="form-label" for="price">Unit Price (₹) *</label>
              <input type="number" step="0.01" id="price" name="price" class="form-control" placeholder="150.00" required min="0">
            </div>

            <div class="form-group">
              <label class="form-label" for="tax_percent">GST / Tax Percent (%)</label>
              <input type="number" step="0.01" id="tax_percent" name="tax_percent" class="form-control" value="5.00">
            </div>

            <div class="form-group">
              <label class="form-label" for="stock_quantity">Initial Stock Quantity</label>
              <input type="number" id="stock_quantity" name="stock_quantity" class="form-control" value="25" min="0">
            </div>

            <div class="form-group">
              <label class="form-label" for="minimum_stock">Minimum Stock Alert Threshold</label>
              <input type="number" id="minimum_stock" name="minimum_stock" class="form-control" value="5" min="1">
            </div>

            <div class="form-group">
              <label class="form-label" for="image_url">Image URL</label>
              <input type="url" id="image_url" name="image_url" class="form-control" placeholder="https://images.unsplash.com/...">
            </div>
          </div>

          <div class="form-group" style="margin-top:0.5rem;">
            <label class="form-label" for="description">Product Description</label>
            <textarea id="description" name="description" class="form-control" rows="3" placeholder="Enter product description..."></textarea>
          </div>

          <div style="display:flex;gap:1rem;margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary btn-lg">Save Product</button>
            <a href="/admin/products.html" class="btn btn-secondary btn-lg">Cancel</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    if (auth.protectPage('admin')) {}
  </script>
</body>
</html>
