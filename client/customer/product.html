<!DOCTYPE html>

  <style>

      html, body { width: 100%; margin: 0; padding: 0; }

      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }

      main > :last-child { margin-bottom: 0 !important; }

<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col relative selection:bg-secondary selection:text-on-secondary">
  
  <!-- Header -->
  <header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.03)]">
    <div class="h-16 px-margin flex items-center justify-between">
      <div class="flex items-center gap-space-sm">
        <button aria-label="Go back" class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center text-on-surface hover:text-primary transition-colors" onclick="history.back()">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <h1 class="font-headline-sm text-headline-sm font-bold text-primary tracking-tight">Item Details</h1>
      </div>
      <div class="flex items-center gap-space-sm">
        <a href="/customer/cart.html" class="w-10 h-10 rounded-full bg-primary flex items-center justify-center relative text-on-primary">
          <span class="material-symbols-outlined text-[20px]">shopping_cart</span>
          <span class="cart-count absolute -top-1 -right-1 bg-secondary text-on-secondary font-bold text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col relative w-full pt-16 bg-surface">
    <div class="flex flex-col w-full relative pb-28">
      
      <!-- Product Hero Pedestal Container -->
      <div class="relative w-full bg-surface-container-low pt-4 pb-12 flex flex-col items-center justify-center overflow-hidden">
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
          <div class="w-72 h-72 rounded-full bg-secondary-container blur-3xl"></div>
        </div>
        
        <div class="w-full px-margin flex items-center justify-end z-10 mb-2">
          <button aria-label="Add to favorites" class="w-11 h-11 rounded-full bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center active:scale-95 transition-transform" id="favorite-btn" onclick="toggleFavorite()">
            <svg class="w-5 h-5 text-on-surface-variant transition-colors" fill="none" id="heart-icon" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
            </svg>
          </button>
        </div>

        <div class="relative w-full max-w-[280px] aspect-[0.95] flex items-center justify-center z-10 px-4">
          <div class="absolute -top-3 -right-2 w-16 h-16 opacity-30 text-secondary pointer-events-none rotate-12">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66l.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"></path></svg>
          </div>
          <div class="absolute -bottom-2 -left-3 w-14 h-14 opacity-25 text-secondary pointer-events-none -rotate-45">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66l.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"></path></svg>
          </div>
          <div id="product-hero-badge" class="w-36 h-36 rounded-full bg-secondary-container/40 flex items-center justify-center text-secondary shadow-lg">
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
          </div>
        </div>

        <div class="flex items-center gap-2 mt-4 z-10">
          <div class="w-6 h-2 rounded-full bg-secondary"></div>
          <div class="w-2 h-2 rounded-full bg-outline-variant"></div>
          <div class="w-2 h-2 rounded-full bg-outline-variant"></div>
        </div>
      </div>

      <!-- Product Information Sheet -->
      <div class="bg-surface-container-lowest rounded-t-xl -mt-6 relative z-20 px-margin pt-6 flex flex-col gap-6 shadow-[0_-8px_24px_rgba(0,0,0,0.03)]">
        <div class="w-12 h-1 bg-surface-variant rounded-full mx-auto -mt-2"></div>
        
        <div class="flex flex-col gap-2">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container self-start">
            <span class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_rgba(0,108,73,0.8)] animate-pulse"></span>
            <span id="product-stock-badge" class="font-label-sm text-label-sm text-on-secondary-fixed-variant tracking-wide font-semibold">In Stock (Aisle 2 • Chiller)</span>
          </div>

          <div class="flex flex-col mt-1">
            <h2 id="product-title" class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight">Loading Product...</h2>
            <p id="product-unit" class="font-body-md text-body-md text-on-surface-variant font-medium">Scan2Go Supermarket Catalog</p>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <h3 class="font-label-lg text-label-lg font-bold text-primary">Product Details</h3>
          <p id="product-description" class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
            Loading details...
          </p>
        </div>

        <div class="flex flex-col gap-3">
          <h3 class="font-label-lg text-label-lg font-bold text-primary">Product Specifications</h3>
          <div class="grid grid-cols-3 gap-2">
            <div class="flex flex-col items-center justify-center p-3 rounded-DEFAULT bg-surface-container-low text-center">
              <span class="font-label-sm text-label-sm text-on-surface-variant">Barcode</span>
              <span id="product-spec-barcode" class="font-label-md text-label-md font-bold text-primary mt-0.5 font-mono">-</span>
            </div>
            <div class="flex flex-col items-center justify-center p-3 rounded-DEFAULT bg-surface-container-low text-center">
              <span class="font-label-sm text-label-sm text-on-surface-variant">GST Tax</span>
              <span id="product-spec-tax" class="font-headline-sm text-headline-sm font-bold text-primary mt-0.5">5.0%</span>
            </div>
            <div class="flex flex-col items-center justify-center p-3 rounded-DEFAULT bg-surface-container-low text-center">
              <span class="font-label-sm text-label-sm text-on-surface-variant">Stock</span>
              <span id="product-spec-stock" class="font-headline-sm text-headline-sm font-bold text-primary mt-0.5">0</span>
            </div>
          </div>
        </div>

        <div class="p-4 rounded-DEFAULT bg-surface-container flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <path d="m9 12 2 2 4-4"></path>
              </svg>
            </div>
            <div class="flex flex-col">
              <span class="font-label-md text-label-md font-bold text-primary">Scan & Verified</span>
              <span class="font-body-sm text-body-sm text-on-surface-variant">Optimal cold storage confirmed</span>
            </div>
          </div>
          <span id="product-aisle-badge" class="font-label-sm text-label-sm font-semibold text-secondary px-2.5 py-1 rounded-full bg-surface-container-lowest">Aisle 2</span>
        </div>
      </div>

      <!-- Sticky Bottom Action Bar -->
      <div class="fixed bottom-0 inset-x-0 bg-surface-container-lowest/90 backdrop-blur-xl z-40 px-margin py-3 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
        <div class="max-w-md mx-auto flex items-center justify-between gap-4">
          <div class="flex flex-col">
            <span id="product-price" class="font-currency-display text-currency-display text-primary leading-none">₹0.00</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant mt-0.5">/ unit (incl. taxes)</span>
          </div>

          <div class="flex items-center gap-3">
            <div class="flex items-center bg-surface-container-low rounded-full p-1 gap-2">
              <button aria-label="Decrease quantity" class="w-9 h-9 rounded-full bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center active:scale-90 transition-transform" id="qty-minus" onclick="updateQty(-1)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.5" viewBox="0 0 24 24">
                  <line x1="5" x2="19" y1="12" y2="12"></line>
                </svg>
              </button>

              <span class="font-headline-sm text-headline-sm font-bold text-primary w-5 text-center" id="qty-count">1</span>

              <button aria-label="Increase quantity" class="w-9 h-9 rounded-full bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center active:scale-90 transition-transform" id="qty-plus" onclick="updateQty(1)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.5" viewBox="0 0 24 24">
                  <line x1="12" x2="12" y1="5" y2="19"></line>
                  <line x1="5" x2="19" y1="12" y2="12"></line>
                </svg>
              </button>
            </div>

            <button class="flex-1 min-w-[140px] h-12 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 shadow-md active:scale-98 hover:bg-primary transition-all" id="add-to-cart-btn" onclick="handleAddToCart()">
              <svg class="w-5 h-5 text-on-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
                <circle cx="8" cy="21" r="1"></circle>
                <circle cx="19" cy="21" r="1"></circle>
                <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
              </svg>
              <span>Add to Cart</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Toast Notification -->
      <div class="fixed top-20 inset-x-0 mx-auto w-max px-4 py-2 bg-primary text-on-primary rounded-full font-label-md text-label-md flex items-center gap-2 shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50" id="toast">
        <svg class="w-4 h-4 text-secondary-container" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="toast-msg">Added to cart</span>
      </div>

    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    let currentQty = 1;
    let isFavorite = false;
    let activeProduct = null;

    if (auth.protectPage('customer')) {
      cartUI.loadCart();
      loadProductData();
    }

    async function loadProductData() {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');
      const barcode = urlParams.get('barcode');

      try {
        let product;
        if (productId) {
          product = await api.get(`/products/${productId}`);
        } else if (barcode) {
          product = await api.get(`/products/barcode/${barcode}`);
        } else {
          // Default fallback to first demo product if no query param provided
          const data = await api.get('/products');
          product = data.products[0];
        }

        activeProduct = product;
        renderProductDetails(product);
      } catch (err) {
        console.error('Failed to fetch product details:', err);
      }
    }

    function renderProductDetails(p) {
      document.getElementById('product-title').textContent = p.name;
      document.getElementById('product-price').textContent = utils.formatCurrency(p.price);
      document.getElementById('product-description').textContent = p.description || "Supermarket quality product, verified and ready for self-checkout.";
      
      const catName = p.categories?.name || p.category?.name || 'General Supermarket';
      document.getElementById('product-unit').textContent = `Category: ${catName}`;

      const stockCount = p.stock_quantity ?? 0;
      const inStock = stockCount > 0;
      const stockBadge = document.getElementById('product-stock-badge');
      if (stockBadge) {
        stockBadge.textContent = inStock ? `In Stock (${stockCount} Available)` : 'Out of Stock';
      }

      const aisleBadge = document.getElementById('product-aisle-badge');
      if (aisleBadge) {
        aisleBadge.textContent = catName;
      }

      const bcodeEl = document.getElementById('product-spec-barcode');
      const taxEl = document.getElementById('product-spec-tax');
      const stockEl = document.getElementById('product-spec-stock');
      if (bcodeEl) bcodeEl.textContent = p.barcode || '-';
      if (taxEl) taxEl.textContent = `${parseFloat(p.tax_percent || 0).toFixed(1)}%`;
      if (stockEl) stockEl.textContent = stockCount;
    }

    function updateQty(delta) {
      currentQty = Math.max(1, currentQty + delta);
      document.getElementById('qty-count').textContent = currentQty;
    }

    function toggleFavorite() {
      isFavorite = !isFavorite;
      const heartIcon = document.getElementById('heart-icon');
      if (isFavorite) {
        heartIcon.setAttribute('fill', 'currentColor');
        heartIcon.classList.remove('text-on-surface-variant');
        heartIcon.classList.add('text-error');
        showToast('Saved to your favorites');
      } else {
        heartIcon.setAttribute('fill', 'none');
        heartIcon.classList.remove('text-error');
        heartIcon.classList.add('text-on-surface-variant');
        showToast('Removed from favorites');
      }
    }

    async function handleAddToCart() {
      if (!activeProduct) return;
      const btn = document.getElementById('add-to-cart-btn');
      btn.classList.add('scale-95');
      setTimeout(() => btn.classList.remove('scale-95'), 150);

      await cartUI.addToCart(activeProduct.id, activeProduct.barcode, currentQty);
      showToast(currentQty + ' item' + (currentQty > 1 ? 's' : '') + ' added to cart');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2200);
    }
  </script>
</body>
</html>
