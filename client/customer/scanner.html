<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Product Barcode — Scan2Go</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/customer.css">
</head>
<body style="background:#081a14;color:#ffffff;">
  <div id="app" style="background:#081a14;min-height:100vh;">
    
    <!-- Top Bar matching Screen 2 Spec -->
    <div class="container flex items-center justify-between" style="padding:1rem 1.25rem 0.5rem;max-width:480px;margin:0 auto;">
      <a href="/customer/dashboard.html" class="favorite-btn" style="position:relative;top:0;right:0;background:rgba(255,255,255,0.15);color:#ffffff;border:none;" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>

      <div class="text-center">
        <h2 style="color:#ffffff;font-size:1.15rem;">Scan Product</h2>
        <p style="color:rgba(255,255,255,0.65);font-size:0.78rem;">Point your camera at the barcode</p>
      </div>

      <button class="favorite-btn" style="position:relative;top:0;right:0;background:rgba(255,255,255,0.15);color:#ffffff;border:none;" aria-label="Flashlight">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
    </div>

    <!-- Main Scanner Body Container -->
    <main class="container" style="max-width:440px;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 1.25rem 5rem;">
      
      <!-- Camera / Webcam Selector -->
      <div style="width:100%;max-width:310px;margin-bottom:0.75rem;">
        <select id="cust-camera-select" class="form-control" style="font-size:0.85rem;padding:0.4rem 0.6rem;background:rgba(255,255,255,0.1);color:#ffffff;border:1px solid rgba(255,255,255,0.2);"></select>
      </div>

      <!-- Camera Barcode Frame -->
      <div class="scanner-frame" id="reader">
        <div class="scanner-laser"></div>
      </div>

      <!-- Guidance Section -->
      <div class="text-center" style="margin-top:0.75rem;margin-bottom:1.5rem;">
        <div class="flex items-center justify-center gap-2" style="color:var(--accent-green);margin-bottom:0.4rem;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
        </div>
        <h4 style="color:#ffffff;font-size:1rem;font-weight:700;">Align the barcode within the frame</h4>
        <p style="color:rgba(255,255,255,0.6);font-size:0.8rem;margin-top:0.15rem;">Scanning will happen automatically</p>
      </div>

      <!-- Outline Button for Manual Entry -->
      <button onclick="toggleManualEntry()" class="btn btn-outline" style="font-size:0.88rem;padding:0.7rem 1.4rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/><path d="M7 16h10"/></svg>
        Enter barcode manually
      </button>

      <!-- Scanned Product Preview Overlay -->
      <div id="scanned-product-preview" class="card hidden" style="width:100%;margin-top:1.25rem;background:#ffffff;color:var(--text-main);border-color:var(--accent-green);box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <div class="flex items-center gap-3">
          <img id="scanned-img" src="" style="width:60px;height:60px;border-radius:var(--radius-sm);object-fit:cover;background:#f4f6f4;" alt="Product">
          <div style="flex:1;">
            <div id="scanned-name" class="font-bold" style="font-size:0.95rem;color:var(--text-main);"></div>
            <div id="scanned-barcode" style="font-size:0.75rem;font-family:monospace;color:var(--text-muted);"></div>
            <div id="scanned-price" style="color:var(--primary-dark);font-weight:800;font-size:1.1rem;margin-top:0.15rem;"></div>
          </div>
          <button id="btn-add-scanned" class="btn btn-primary btn-sm" style="font-size:0.8rem;padding:0.5rem 0.85rem;">Add to Cart</button>
        </div>
      </div>

      <!-- Manual Input Card -->
      <div id="manual-entry-card" class="card hidden" style="width:100%;background:#ffffff;color:var(--text-main);margin-top:1.25rem;">
        <h4 style="margin-bottom:0.75rem;color:var(--text-main);font-size:0.95rem;">Enter Product Barcode</h4>
        <div class="flex gap-2">
          <input type="text" id="manual-barcode-input" class="form-control" placeholder="e.g. 8901234567890">
          <button class="btn btn-primary btn-sm" onclick="handleManualBarcode()">Submit</button>
        </div>
        <div style="margin-top:0.6rem;font-size:0.75rem;color:var(--text-muted);">Demo: 8901234567890, 8901234567894</div>
      </div>

    </main>

    <!-- Floating Mobile Bottom Nav Bar -->
    <div class="mobile-nav">
      <a href="/customer/dashboard.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Home
      </a>
      <a href="/customer/dashboard.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
      </a>
      <a href="/customer/scanner.html" class="mobile-nav-item scan-fab active" aria-label="Scan Barcode">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
      </a>
      <a href="/customer/cart.html" class="mobile-nav-item" style="position:relative;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="nav-badge-count cart-count">0</span>
        Cart
      </a>
      <a href="/customer/orders.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Profile
      </a>
    </div>

  </div>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/scanner.js"></script>
  <script>
    let scannerEngine = null;

    if (auth.protectPage('customer')) {
      cartUI.loadCart();
      initScanner();
    }

    async function initScanner() {
      scannerEngine = new BarcodeScannerEngine({
        renderTargetId: 'reader',
        onScanSuccess: (barcodeText) => {
          lookupBarcode(barcodeText);
        },
        onError: (err) => {
          console.log('Camera warning:', err);
        }
      });
      await scannerEngine.startScanner();
      await scannerEngine.populateCameraSelect('cust-camera-select');
    }

    async function lookupBarcode(barcode) {
      try {
        const product = await api.get(`/products/barcode/${barcode}`);
        utils.playBeep();

        document.getElementById('scanned-product-preview').classList.remove('hidden');
        document.getElementById('scanned-name').textContent = product.name;
        document.getElementById('scanned-barcode').textContent = `BARCODE: ${product.barcode}`;
        document.getElementById('scanned-price').textContent = utils.formatCurrency(product.price);
        document.getElementById('scanned-img').src = product.image_url || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=500';

        document.getElementById('btn-add-scanned').onclick = async () => {
          await cartUI.addToCart(product.id, product.barcode, 1);
          document.getElementById('scanned-product-preview').classList.add('hidden');
        };
      } catch (err) {
        utils.showToast(`No product found for barcode ${barcode}`, 'error');
      }
    }

    function toggleManualEntry() {
      const card = document.getElementById('manual-entry-card');
      card.classList.toggle('hidden');
    }

    async function handleManualBarcode() {
      const code = document.getElementById('manual-barcode-input').value.trim();
      if (code) {
        await lookupBarcode(code);
      }
    }
  </script>
</body>
</html>
