<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Receipt & Exit Pass — Scan2Go</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/customer.css">
  <!-- Include QRCode.js library for rendering client-side QR canvas -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Navbar Header -->
    <nav class="navbar">
      <div class="container flex items-center justify-between" style="padding:0 1rem;max-width:480px;margin:0 auto;">
        <a href="/customer/dashboard.html" class="nav-brand flex-col">
          <div class="flex items-center gap-2">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary-dark);"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
            SCAN<span style="color:var(--accent-green);">2</span>GO
          </div>
          <span class="tagline">Scan. Shop. Pay. Go.</span>
        </a>
        <a href="/customer/orders.html" class="btn btn-secondary btn-sm" style="font-size:0.78rem;padding:0.4rem 0.8rem;">My Orders</a>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container" style="padding:1rem;max-width:480px;margin:0 auto;flex:1;text-align:center;">
      <div class="card" style="box-shadow:var(--shadow-lg);">
        <div style="width:60px;height:60px;background:var(--accent-green-bg);color:var(--accent-green);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 0.85rem;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2 style="margin-bottom:0.25rem;color:var(--primary-dark);font-size:1.4rem;">Payment Verified!</h2>
        <p class="text-muted" style="margin-bottom:1.25rem;font-size:0.85rem;">Present this single-use digital QR exit pass to security staff at the store gate.</p>

        <div class="qr-container" style="padding:1.25rem;margin:1rem 0;">
          <div id="qr-code-canvas" style="display:flex;justify-content:center;align-items:center;"></div>
        </div>

        <div style="margin-bottom:1.25rem;">
          <span id="qr-order-status" class="badge badge-success" style="font-size:0.85rem;padding:0.35rem 1rem;">PAID</span>
        </div>

        <div style="background:#f8faf8;padding:1rem;border-radius:var(--radius-md);text-align:left;border:1px solid var(--border-color);font-size:0.85rem;">
          <div style="display:flex;justify-content:space-between;margin-bottom:0.3rem;">
            <span class="text-muted">Order Ref:</span>
            <span id="qr-order-number" class="font-bold" style="color:var(--primary-dark);"></span>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span class="text-muted">Total Paid:</span>
            <span id="qr-total-amount" class="font-bold" style="color:var(--primary-dark);"></span>
          </div>
        </div>

        <a href="/customer/dashboard.html" class="btn btn-primary btn-block btn-lg" style="margin-top:1.25rem;font-size:0.95rem;">Return to Store Home</a>
      </div>
    </main>

    <!-- Floating Mobile Bottom Nav Bar -->
    <div class="mobile-nav">
      <a href="/customer/dashboard.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Home
      </a>
      <a href="/customer/dashboard.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
      </a>
      <a href="/customer/scanner.html" class="mobile-nav-item scan-fab" aria-label="Scan Barcode">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
      </a>
      <a href="/customer/cart.html" class="mobile-nav-item" style="position:relative;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="nav-badge-count cart-count">0</span>
        Cart
      </a>
      <a href="/customer/orders.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Profile
      </a>
    </div>

  </div>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/checkout.js"></script>
  <script>
    if (auth.protectPage('customer')) {
      checkoutUI.renderSuccessQRPage();
    }
  </script>
</body>
</html>
