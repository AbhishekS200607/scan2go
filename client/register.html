<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account — Scan2Go</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/customer.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;background:var(--bg-main);">
  <div class="card" style="width:100%;max-width:460px;box-shadow:var(--shadow-lg);padding:2rem;">
    <div style="text-align:center;margin-bottom:1.75rem;">
      <a href="/" class="nav-brand flex-col" style="align-items:center;margin-bottom:0.75rem;">
        <div class="flex items-center gap-2">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary-dark);"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
          SCAN<span style="color:var(--accent-green);">2</span>GO
        </div>
        <span class="tagline">Scan. Shop. Pay. Go.</span>
      </a>
      <h2 style="font-size:1.6rem;color:var(--primary-dark);">Create Customer Account</h2>
      <p class="text-muted" style="font-size:0.9rem;">Join smart self-checkout shopping</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Jane Doe" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="jane@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 98765 43210">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1rem;">Register Account</button>
    </form>

    <div style="margin-top:1.25rem;text-align:center;font-size:0.9rem;" class="text-muted">
      Already have an account? <a href="/login.html" class="font-bold" style="color:var(--primary-dark);">Sign In</a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('full_name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const pass = document.getElementById('password').value;
      try {
        await auth.register(name, email, pass, phone, 'customer');
      } catch (err) {}
    });
  </script>
</body>
</html>
