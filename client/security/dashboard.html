<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Exit Gate Scanner — Scan2Go</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/customer.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div id="app">
    <!-- Navbar Header -->
    <nav class="navbar">
      <div class="container flex items-center justify-between">
        <a href="/security/dashboard.html" class="nav-brand flex-col">
          <div class="flex items-center gap-2">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary-dark);"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            SECURITY<span style="color:var(--accent-green);">GATE</span>
          </div>
          <span class="tagline">Exit Pass Verification System</span>
        </a>
        <div class="flex items-center gap-3">
          <button class="notification-bell btn btn-secondary btn-sm flex items-center gap-1" aria-label="Notifications" style="position:relative;padding:0.4rem 0.65rem;" title="Notifications Drawer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notification-unread-count badge badge-danger" style="display:none;font-size:0.7rem;padding:0.15rem 0.4rem;border-radius:10px;">0</span>
          </button>
          <span id="security-user-name" class="font-bold" style="font-size:0.9rem;color:var(--primary-dark);">Security Staff</span>
          <button onclick="auth.logout()" class="btn btn-secondary btn-sm">Logout</button>
        </div>
      </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container" style="padding-top:1.5rem;flex:1;max-width:1200px;">
      
      <div class="security-desktop-grid">
        
        <!-- Left Column: Camera Scanner & Manual Input -->
        <div class="security-left-col">
          <div class="card no-print" style="margin-bottom:1.5rem;text-align:center;box-shadow:var(--shadow-md);">
            <h2 style="color:var(--primary-dark);margin-bottom:0.3rem;font-size:1.3rem;">Scan Customer Exit Pass</h2>
            <p class="text-muted" style="margin-bottom:1rem;font-size:0.85rem;">
              Point camera or select webcam to verify customer exit pass.
            </p>

            <!-- Camera / Webcam Device Selector for Desktop -->
            <div style="margin-bottom:0.85rem;text-align:left;">
              <label for="security-camera-select" class="form-label" style="font-size:0.75rem;margin-bottom:0.25rem;">Camera / Webcam Device:</label>
              <select id="security-camera-select" class="form-control" style="font-size:0.8rem;padding:0.4rem 0.65rem;background:#ffffff;border:1px solid var(--border-color);"></select>
            </div>

            <!-- Scanner Frame -->
            <div class="scanner-frame" id="security-reader" style="background:#081a14;margin:0 auto 1rem;">
              <div class="scanner-laser"></div>
            </div>

            <div style="display:flex;gap:0.75rem;justify-content:center;margin-bottom:1rem;flex-wrap:wrap;">
              <button id="btn-toggle-security-camera" class="btn btn-secondary btn-sm" onclick="securityUI.toggleCamera()">Toggle Camera Scanner</button>
            </div>

            <!-- Manual QR Token Entry Fallback -->
            <div style="padding-top:1rem;border-top:1px solid var(--border-color);">
              <div class="form-label" style="margin-bottom:0.4rem;text-align:left;font-size:0.8rem;">Manual Order Ref / Pass Token:</div>
              <div class="flex gap-2">
                <input type="text" id="security-token-input" class="form-control" placeholder="e.g. SG-482318 or token hash..." style="font-size:0.85rem;">
                <button class="btn btn-primary btn-sm" onclick="securityUI.verifyTokenManual()">Verify & Exit</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column: Verification Result (Invoice) & Audit Trail -->
        <div class="security-right-col">
          <!-- Real-Time Verification Result Render Container -->
          <div id="security-result-container"></div>

          <!-- Recent Exit Verifications Audit Trail Table -->
          <div class="card no-print" style="box-shadow:var(--shadow-md);">
            <h3 style="margin-bottom:1rem;color:var(--primary-dark);font-size:1.1rem;">Recent Exit Verifications Audit Trail</h3>
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Order Ref</th>
                    <th>Result</th>
                    <th>Reason</th>
                    <th>Verified By</th>
                    <th>Timestamp</th>
                  </tr>
                </thead>
                <tbody id="security-logs-table">
                  <!-- Loaded dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/scanner.js"></script>
  <script src="/js/security.js"></script>
  <script>
    if (auth.protectPage('security', 'admin')) {
      const user = auth.getUser();
      if (user) {
        document.getElementById('security-user-name').textContent = user.full_name || 'Security Staff';
      }
      securityUI.initSecurityGate();
    }
  </script>
</body>
</html>
